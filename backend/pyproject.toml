[project]
name = "budget-wise-backend"
version = "2.0.0"
description = "FastAPI backend for BudgetWise"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "sqlmodel",
  "alembic",
  "pandas",
  "python-dotenv",
  "openpyxl",
  "python-multipart",
  "psycopg[binary]",
  "pydantic>=2",
  "pydantic-settings>=2",
]

[tool.uv]
dev-dependencies = [
  "ruff>=0.6.9",
  "unicode-slugify>=0.1.5",
]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
# Add W292 (no newline at end of file) by including the "W" (pycodestyle warnings) class.
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "C4"]
ignore = ["E203", "E501"]

# [tool.ruff.lint.per-file-ignores]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"
