[project]
name = "budget-wise-backend"
version = "4.0.0"
description = "FastAPI backend for BudgetWise"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "sqlmodel",
  "alembic",
  "pandas",
  "python-dotenv",
  "openpyxl",
  "python-multipart",
  "psycopg[binary]",
  "pydantic>=2",
  "pydantic-settings>=2",
  "python-slugify>=8.0.4",
  "apscheduler>=3.11.0",
  "httpx[http2]>=0.28.1",
  "openai>=1.109.1",
]

[tool.uv]
dev-dependencies = [
  "ruff>=0.6.9",
  "unicode-slugify>=0.1.5",
]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
extend-exclude = ["tests", "alembic/versions/*"]

[tool.ruff.lint]
# Add W292 (no newline at end of file) by including the "W" (pycodestyle warnings) class.
# FURB - refurb > https://docs.astral.sh/ruff/rules/#refurb-furb

select = ["E", "W", "F", "I", "N", "UP", "B", "S", "C4", "FURB"]
ignore = ["E203", "E501"]

# [tool.ruff.lint.per-file-ignores]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 60

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# Allow default arguments like, e.g., `data: List[str] = fastapi.Query(None)`.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
